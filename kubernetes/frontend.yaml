apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator-dashboard
  namespace: zimvisit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: operator-dashboard
  template:
    metadata:
      labels:
        app: operator-dashboard
    spec:
      containers:
      - name: operator
        image: zimvisit/operator-dashboard:latest
        ports:
        - containerPort: 3001
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: operator-dashboard
  namespace: zimvisit
spec:
  selector:
    app: operator-dashboard
  ports:
  - port: 3001
    targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: government-portal
  namespace: zimvisit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: government-portal
  template:
    metadata:
      labels:
        app: government-portal
    spec:
      containers:
      - name: government
        image: zimvisit/government-portal:latest
        ports:
        - containerPort: 3002
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: government-portal
  namespace: zimvisit
spec:
  selector:
    app: government-portal
  ports:
  - port: 3002
    targetPort: 3002