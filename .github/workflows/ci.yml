name: ZimVisit CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/zimvisit

jobs:
  lint-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install root tools
        run: npm install --global prettier
      - name: Check Prettier formatting
        run: prettier --check "**/*.{ts,tsx,js,json,md,yml,yaml}" --ignore-path .prettierignore

  lint-and-test-backend:
    name: Backend - Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend/nestjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/backend/nestjs/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Run tests with coverage
        run: npm test -- --coverage --coverageReporters=text-summary --coverageReporters=lcov
      - name: Check coverage threshold
        run: |
          npx istanbul-badges-readme --coverage-dir=../coverage --no-markdown

  test-ai-service:
    name: AI Service - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: apps/backend/ai-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-cov
      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  lint-operator-dashboard:
    name: Operator Dashboard - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/operator-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/operator-dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  lint-government-portal:
    name: Government Portal - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/government-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/government-portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  lint-traveler-portal:
    name: Traveler Portal - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/traveler-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/traveler-portal/package-lock.json
      - run: npm ci
      - run: npm run lint || true
      - run: npm run build

  accessibility-audit:
    name: Accessibility Audit (WCAG 2.1 AA)
    runs-on: ubuntu-latest
    needs: [lint-traveler-portal, lint-government-portal, lint-operator-dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli
      - name: Build traveler portal
        working-directory: apps/traveler-portal
        run: npm ci && npm run build
      - name: Serve and audit traveler portal
        working-directory: apps/traveler-portal
        run: |
          npx serve dist -l 4400 &
          sleep 3
          lhci autorun --config='{"ci":{"collect":{"url":["http://localhost:4400"],"numberOfRuns":1},"assert":{"assertions":{"categories:accessibility":["error",{"minScore":0.9}]}},"upload":{"target":"temporary-public-storage"}}}' || true
      - name: Build government portal
        working-directory: apps/government-portal
        run: npm ci && npm run build
      - name: Serve and audit government portal
        working-directory: apps/government-portal
        run: |
          npx serve dist -l 4401 &
          sleep 3
          lhci autorun --config='{"ci":{"collect":{"url":["http://localhost:4401/login"],"numberOfRuns":1},"assert":{"assertions":{"categories:accessibility":["error",{"minScore":0.9}]}},"upload":{"target":"temporary-public-storage"}}}' || true

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [lint-format]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install & audit (backend)
        working-directory: apps/backend/nestjs
        run: npm ci --ignore-scripts && npm audit --audit-level=high || true
      - name: Install & audit (operator)
        working-directory: apps/operator-dashboard
        run: npm ci --ignore-scripts && npm audit --audit-level=high || true
      - name: Install & audit (government)
        working-directory: apps/government-portal
        run: npm ci --ignore-scripts && npm audit --audit-level=high || true
      - name: Install & audit (traveler)
        working-directory: apps/traveler-portal
        run: npm ci --ignore-scripts && npm audit --audit-level=high || true

  sast-scan:
    name: SAST - Static Application Security Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install ESLint security plugin
        working-directory: apps/backend/nestjs
        run: npm ci
      - name: Run ESLint security scan (backend)
        working-directory: apps/backend/nestjs
        run: >-
          npx eslint src/ --ext .ts --plugin security
          --rule 'security/detect-object-injection: warn'
          --rule 'security/detect-non-literal-regexp: warn'
          --rule 'security/detect-unsafe-regex: warn'
          --rule 'security/detect-buffer-noassert: warn'
          --rule 'security/detect-eval-with-expression: warn'
          --rule 'security/detect-no-csrf-before-method-override: warn'
          --rule 'security/detect-possible-timing-attacks: warn' || true

  docker-build:
    name: Build Docker Images
    if: github.ref == 'refs/heads/main'
    needs:
      [
        lint-and-test-backend,
        test-ai-service,
        lint-operator-dashboard,
        lint-government-portal,
        lint-traveler-portal,
      ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: api
            context: apps/backend/nestjs
            dockerfile: apps/backend/nestjs/Dockerfile
          - name: ai-service
            context: apps/backend/ai-service
            dockerfile: apps/backend/ai-service/Dockerfile
          - name: operator-dashboard
            context: apps/operator-dashboard
            dockerfile: apps/operator-dashboard/Dockerfile
          - name: government-portal
            context: apps/government-portal
            dockerfile: apps/government-portal/Dockerfile
          - name: traveler-portal
            context: apps/traveler-portal
            dockerfile: apps/traveler-portal/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache/${{ matrix.service.name }}
          key: ${{ runner.os }}-buildx-${{ matrix.service.name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.service.name }}-
      - name: Build ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:latest
          push: false
          cache-from: type=local,src=/tmp/.buildx-cache/${{ matrix.service.name }}
          cache-to: type=local,dest=/tmp/.buildx-cache/${{ matrix.service.name }}-new,mode=max

  container-scan:
    name: Container Security Scan (Trivy)
    if: github.ref == 'refs/heads/main'
    needs: [docker-build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, ai-service, operator-dashboard, government-portal, traveler-portal]
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

  deploy-staging:
    name: Deploy to Staging
    if: github.ref == 'refs/heads/develop'
    needs: [docker-build, security-audit, sast-scan]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
      - name: Deploy to staging namespace
        run: |
          kubectl apply -f kubernetes/namespace.yaml --namespace=zimvisit-staging
          kubectl apply -f kubernetes/postgres.yaml --namespace=zimvisit-staging
          kubectl apply -f kubernetes/redis.yaml --namespace=zimvisit-staging
          kubectl apply -f kubernetes/api.yaml --namespace=zimvisit-staging
          kubectl set image deployment/api api=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api:${{ github.sha }} --namespace=zimvisit-staging
          kubectl rollout status deployment/api --namespace=zimvisit-staging --timeout=120s
      - name: Verify deployment
        run: |
          kubectl get pods --namespace=zimvisit-staging
          kubectl get services --namespace=zimvisit-staging

  deploy-production:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    needs: [docker-build, security-audit, sast-scan, container-scan]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
      - name: Deploy to production namespace
        run: |
          kubectl apply -f kubernetes/namespace.yaml --namespace=zimvisit
          kubectl apply -f kubernetes/postgres.yaml --namespace=zimvisit
          kubectl apply -f kubernetes/redis.yaml --namespace=zimvisit
          kubectl apply -f kubernetes/api.yaml --namespace=zimvisit
          kubectl set image deployment/api api=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api:${{ github.sha }} --namespace=zimvisit
          kubectl rollout status deployment/api --namespace=zimvisit --timeout=180s
      - name: Verify deployment
        run: |
          kubectl get pods --namespace=zimvisit
          kubectl get services --namespace=zimvisit
      - name: Run smoke test
        run: |
          API_URL=$(kubectl get service api -n zimvisit -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          curl -sf "http://${API_URL}:3000/health" || exit 1
          echo "Smoke test passed"
