name: ZimVisit CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  lint-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install root tools
        run: npm install --global prettier
      - name: Check Prettier formatting
        run: prettier --check "**/*.{ts,tsx,js,json,md,yml,yaml}" --ignore-path .prettierignore

  lint-and-test-backend:
    name: Backend - Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend/nestjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/backend/nestjs/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --passWithNoTests

  test-ai-service:
    name: AI Service - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: apps/backend/ai-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest tests/ -v --tb=short

  lint-operator-dashboard:
    name: Operator Dashboard - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/operator-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/operator-dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  lint-government-portal:
    name: Government Portal - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/government-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/government-portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker-build:
    name: Build Docker Images
    if: github.ref == 'refs/heads/main'
    needs: [lint-and-test-backend, test-ai-service, lint-operator-dashboard, lint-government-portal]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: api
            context: apps/backend/nestjs
            dockerfile: apps/backend/nestjs/Dockerfile
          - name: ai-service
            context: apps/backend/ai-service
            dockerfile: apps/backend/ai-service/Dockerfile
          - name: operator-dashboard
            context: apps/operator-dashboard
            dockerfile: apps/operator-dashboard/Dockerfile
          - name: government-portal
            context: apps/government-portal
            dockerfile: apps/government-portal/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache/${{ matrix.service.name }}
          key: ${{ runner.os }}-buildx-${{ matrix.service.name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.service.name }}-
      - name: Build ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          tags: zimvisit/${{ matrix.service.name }}:${{ github.sha }},zimvisit/${{ matrix.service.name }}:latest
          push: false
          cache-from: type=local,src=/tmp/.buildx-cache/${{ matrix.service.name }}
          cache-to: type=local,dest=/tmp/.buildx-cache/${{ matrix.service.name }}-new,mode=max

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [lint-format]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check npm audit (backend)
        working-directory: apps/backend/nestjs
        run: npm audit --audit-level=high || true
      - name: Check npm audit (operator)
        working-directory: apps/operator-dashboard
        run: npm audit --audit-level=high || true
      - name: Check npm audit (government)
        working-directory: apps/government-portal
        run: npm audit --audit-level=high || true

  deploy-staging:
    name: Deploy to Staging
    if: github.ref == 'refs/heads/develop'
    needs: [docker-build, security-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging cluster
        run: |
          echo "Deploying to staging environment..."
          # kubectl apply -f kubernetes/ --namespace=zimvisit-staging

  deploy-production:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    needs: [docker-build, security-audit]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production cluster
        run: |
          echo "Deploying to production environment..."
          # kubectl apply -f kubernetes/ --namespace=zimvisit
